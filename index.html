<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merdiven Atölyesi / İki Model</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;background:#f1f3ed;color:#263127}header{height:76px;padding:12px 24px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #d4dbcf;background:#fafbf7}h1{font-size:17px;font-weight:600;margin:0}header small{display:block;font-size:10px;color:#73816c;margin-top:5px}nav{display:flex;gap:5px;margin-left:auto}button{cursor:pointer;background:transparent;border:1px solid #d4dbcf;border-radius:5px;padding:10px 17px;color:#475340;font:inherit}button.active{background:#34442f;color:white;border-color:#34442f}.workspace{display:flex;height:calc(100dvh - 76px)}section{display:none;flex:1;min-width:0;flex-direction:column}section.visible{display:flex}iframe{border:0;width:100%;flex:1;min-height:0}.label{display:none;padding:10px 20px;font-size:11px;letter-spacing:1px;border-bottom:1px solid #d4dbcf;background:#fafbf7}.comparison section+section{border-left:1px solid #d4dbcf}.comparison .label{display:block}@media(max-width:650px){header{height:112px;padding:12px;flex-wrap:wrap;gap:10px}nav{margin:0;width:100%}nav button{flex:1;padding:9px 7px;font-size:12px}.workspace{height:calc(100dvh - 112px)}.comparison{display:block;overflow:auto}.comparison section{height:70vh;min-height:420px}.comparison section+section{border-left:0;border-top:1px solid #d4dbcf}}
</style></head><body><header><div><h1>Merdiven Atölyesi</h1><small>Aynı yapı · İki farklı mekânsal yorum</small></div><nav aria-label="Model seçimi"><button data-mode="model1">Model 1</button><button data-mode="model2">Model 2</button><button data-mode="compare">Yan yana karşılaştır</button></nav></header><main class="workspace"><section id="panel1"><div class="label">MODEL 1 / SENİN ÇALIŞMAN</div><iframe id="one" title="Model 1 — özgün tasarım" src="model1/index.html"></iframe></section><section id="panel2"><div class="label">MODEL 2 / SIKIŞMA → DÖNME → AÇILMA</div><iframe id="two" title="Model 2 — yeni öneri" src="model2.html"></iframe></section></main><script>
const panels=[document.getElementById('panel1'),document.getElementById('panel2')];
function show(){const mode=['model1','model2','compare'].includes(location.hash.slice(1))?location.hash.slice(1):'compare';document.querySelector('.workspace').classList.toggle('comparison',mode==='compare');panels.forEach((p,i)=>p.classList.toggle('visible',mode==='compare'||mode==='model'+(i+1)));document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});for(const id of ['one','two']){const doc=document.getElementById(id).contentDocument;if(doc&&doc.getElementById('hub-layout'))doc.getElementById('hub-layout').disabled=mode!=='compare'}}
for(const id of ['one','two'])document.getElementById(id).addEventListener('load',()=>{const doc=document.getElementById(id).contentDocument;const s=doc.createElement('style');s.id='hub-layout';s.textContent='header,aside{display:none!important}main{display:block!important;height:100dvh!important;min-height:0!important}.viewer{height:100dvh!important;min-height:0!important;order:0!important}.viewer-heading{top:16px!important}.view-nav{top:62px!important}.model-caption{bottom:59px!important}';doc.head.append(s);show()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode});addEventListener('hashchange',show);show();
</script></body></html>
